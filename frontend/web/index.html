<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EkRide - Smart Student Ride-Sharing Web Application">
  
  <!-- Prevent stale caching -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>EkRide - Smart Student Ride-Sharing</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin: 0; background-color: #0b1120; overflow: hidden;">
  <script>
    // Force unregister all service workers and clear caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    const script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + Date.now();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
