server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:map_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ekride:
  google:
    api-key: "${GOOGLE_MAPS_API_KEY:}"
    api-key-file: "${GOOGLE_MAPS_API_KEY_FILE:Api-key.txt}"
    demo-mode-fallback: true
