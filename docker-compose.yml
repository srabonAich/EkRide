services:
  postgres:
    image: postgres:16-alpine
    container_name: ekride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-map_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - ekride_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-map_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ekride_pgdata:
